<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Aplica el tema elegido antes de pintar (ver src/hooks/useTheme.js). redux-persist guarda el slice
      // `preferences` en "persist:preferences", con cada campo como texto JSON
      try {
        const saved = JSON.parse(localStorage.getItem('persist:preferences'))
        const theme = saved && JSON.parse(saved.theme)
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {
        // Sin almacenamiento: se usa el tema del sistema
      }
    </script>
    <meta name="description" content="PLAN: experiencias armadas por gente local para hacer un plan distinto, en tu ciudad o en la que visites." />
    <!-- Cómo se ve el link al compartirlo (WhatsApp, redes): título, descripción e imagen -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PLAN" />
    <meta property="og:title" content="PLAN · Hacé un plan distinto" />
    <meta property="og:description" content="Experiencias armadas por gente local, con fecha y cupo. Reservá tu lugar en tu ciudad o en la que visites." />
    <meta property="og:image" content="/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>PLAN · Experiencias</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
